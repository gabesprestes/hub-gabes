name: Sync G1 headlines

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g1-headlines
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ler manchetes do G1
        env:
          TZ: America/Sao_Paulo
        run: node --experimental-strip-types scripts/sync-news.ts
      - name: Publicar manchetes
        run: |
          git add public/news.json
          if git diff --cached --quiet; then
            echo "Manchetes sem mudança."
          else
            git -c user.name="hub-gabes" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update G1 headlines"
            git push
          fi
